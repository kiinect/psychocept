# Monkey Pop TD co-op relay: one Durable Object per room code forwards messages between up to 4 players.
# Deploy: npx wrangler login && npx wrangler deploy   (free plan is enough)
name = "mpt-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated origins allowed to open rooms (the game's site plus local dev).
ALLOWED_ORIGINS = "https://psychocept.org,https://www.psychocept.org,http://localhost:5199,http://localhost:5200,http://localhost:4173"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
